<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel SUPERTEC</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#1b2b46;font:15px/1.5 system-ui,Arial}main{max-width:1050px;margin:auto;padding:28px 15px}h1{color:#184b9b}section{background:#fff;border:1px solid #d6e0ed;border-radius:15px;padding:24px;margin:18px 0;box-shadow:0 8px 28px #16376412}input,button{font:inherit;padding:12px;border-radius:9px}input{border:1px solid #b9c7dc;max-width:100%;width:100%}label{display:block;margin:12px 0;max-width:420px}button{background:#1857bb;border:0;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e5edfa;color:#1d4b8b}.buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.record{border:1px solid #d5dfeb;border-radius:12px;padding:20px;margin:14px 0}.record h3{margin:0}.field{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e6ecf4}.field span{overflow-wrap:anywhere}.field button{flex-shrink:0;padding:7px 10px;font-size:12px}.muted{color:#69788e}#notice{min-height:24px;color:#1857bb}[hidden]{display:none!important}@media(max-width:550px){.field{align-items:start;flex-direction:column}.field button{align-self:end}}
</style></head><body><main><h1>SUPERTEC · Painel administrativo</h1><p class="muted">Fichas de matrícula recebidas</p><section id="login"><h2>Acesso restrito</h2><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Entrar</button></form></section><section id="panel" hidden><div class="buttons"><button id="refresh">Atualizar</button><button id="logout" class="secondary">Sair</button></div><div id="records"></div><div class="buttons"><button id="prev" class="secondary">Anterior</button><span id="pageLabel"></span><button id="next" class="secondary">Próxima</button></div></section><p id="notice" role="status"></p></main><script>
const base='https://rawgfjtzkvoipirygotk.supabase.co',key='sb_publishable_kjVPKNjIRGFSzVZKiXFLSg_2J3dG5_i';
const allowed='guilherme.amaral.invest@gmail.com';let token=null,page=1,more=false;
const $=id=>document.getElementById(id),notice=s=>$('notice').textContent=s;
const fields=[['Nome completo','nome_completo'],['CPF','cpf'],['RG','rg'],['Emissão do RG','emissao_rg'],['Nome da mãe','nome_mae'],['Nascimento','nascimento'],['Cidade natal','cidade_natal'],['E-mail','email'],['Endereço completo','endereco'],['CEP','cep'],['Instituição de ensino','instituicao_ensino'],['Ano de conclusão','ano_conclusao'],['Forma de pagamento','pagamento']];
function line(d,k){return d[k]==null?'':String(d[k])}
function fullText(d){return fields.map(([label,k])=>label+': '+line(d,k)).join('\n')}
async function copy(value,button,original){try{await navigator.clipboard.writeText(value);button.textContent='Copiado!';setTimeout(()=>button.textContent=original,1500)}catch{notice('Não foi possível copiar; confira a permissão do navegador.')}}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
async function load(){if(!token)return;notice('Carregando...');const q=new URLSearchParams({select:'*',order:'criado_em.desc',limit:'51',offset:String((page-1)*50)});const r=await fetch(base+'/rest/v1/matriculas_supertec?'+q,{headers:{apikey:key,Authorization:'Bearer '+token}});if(!r.ok){notice('Falha ao carregar. Verifique sua sessão e as permissões.');return}const rows=await r.json();more=rows.length>50;$('records').replaceChildren();for(const d of rows.slice(0,50)){const box=node('article','');box.className='record';box.append(node('h3',d.nome_completo||'Cadastro'));box.append(node('p','Recebido em: '+new Date(d.criado_em).toLocaleString('pt-BR')));for(const [label,k] of fields){const row=node('div','');row.className='field';const span=node('span',label+': '+line(d,k));const btn=node('button','Copiar campo');btn.className='secondary';btn.onclick=()=>copy(line(d,k),btn,'Copiar campo');row.append(span,btn);box.append(row)}const btn=node('button','Copiar tudo');btn.onclick=()=>copy(fullText(d),btn,'Copiar tudo');box.append(btn);$('records').append(box)}if(!rows.length)$('records').append(node('p','Nenhuma ficha nesta página.'));$('pageLabel').textContent='Página '+page;$('prev').disabled=page===1;$('next').disabled=!more;notice('Fichas carregadas.')}
$('loginForm').onsubmit=async e=>{e.preventDefault();notice('Autenticando...');const email=$('email').value.trim();if(email.toLowerCase()!==allowed){notice('Acesso não autorizado.');return}try{const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password:$('password').value})});if(!r.ok)throw Error();const d=await r.json();token=d.access_token;$('password').value='';$('login').hidden=true;$('panel').hidden=false;await load()}catch{notice('Não foi possível entrar. Verifique e-mail e senha do usuário cadastrado no Supabase SUPERTEC.')}};
$('refresh').onclick=()=>load();$('logout').onclick=()=>{token=null;$('panel').hidden=true;$('login').hidden=false;notice('Sessão encerrada.')};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(more){page++;load()}};
</script></body></html>
